<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEWMIKS forma</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f2f4);
    --fg: var(--tg-theme-text-color, #16181b);
    --hint: var(--tg-theme-hint-color, #8a9099);
    --accent: var(--tg-theme-button-color, #2f7de1);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(128,128,128,.3);
    --danger: #d64545;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: var(--tg-theme-bg-color, #1c1f24);
      --bg2: var(--tg-theme-secondary-bg-color, #131518);
      --fg: var(--tg-theme-text-color, #eef0f3);
      --hint: var(--tg-theme-hint-color, #8f97a3);
      --accent: var(--tg-theme-button-color, #4a90e8);
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg2);color:var(--fg);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  main{padding:12px 12px 96px;display:grid;gap:12px;max-width:560px;margin:0 auto}
  h1{font-size:20px;margin:6px 4px 0}
  .card{background:var(--bg);border-radius:14px;padding:14px;display:grid;gap:10px}
  label.t{font-size:13px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.04em}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--bg2);color:var(--fg);padding:9px 12px;border-radius:10px;font:inherit;font-size:15px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
  .scroll{max-height:260px;overflow-y:auto;padding:2px}
  input{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font:inherit;font-size:17px;padding:12px;border-radius:10px}
  input:focus{outline:2px solid var(--accent);outline-offset:0}
  .row{display:flex;gap:8px;align-items:center}
  .row input{flex:1;min-width:0}
  .unit{font-weight:600;color:var(--hint);min-width:44px}
  .calc{font-size:14px;color:var(--hint)}
  .calc b{color:var(--fg)}
  .err{color:var(--danger);font-size:14px;min-height:1em}
  #send{display:none;width:100%;border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:700;padding:15px;border-radius:12px}
  textarea{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font:inherit;font-size:16px;padding:12px;border-radius:10px;min-height:230px;resize:vertical}
  textarea:focus{outline:2px solid var(--accent);outline-offset:0}
  .found{font-size:14px;display:grid;gap:4px}
  .found .k{color:var(--hint)}
  .pr{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px}
  .pr .n{font-weight:700}
  .pr .s{font-size:13px;color:var(--hint)}
  .sum{font-size:15px}
  .hidden{display:none!important}
</style>
</head>
<body>
<main>
  <h1 id="title">Forma</h1>

  <section class="card hidden" id="c-mode">
    <div class="chips"><button class="chip" type="button" id="sm-form" aria-pressed="true">✍️ Qo'lda kiritish</button><button class="chip" type="button" id="sm-text" aria-pressed="false">📋 Matndan kiritish</button></div>
  </section>

  <section class="card hidden" id="c-text">
    <label class="t" id="l-text">📋 Buyurtma matni</label>
    <textarea id="otext" placeholder="Matnni shu yerga tashlang, masalan:&#10;&#10;AGROBUSNESS. SP. MANAGEMENT. Dunbirobod&#10;Fura 70 713 QBA&#10;Tel 33-937-3232&#10;Plaster mp77 25 tonna&#10;Betonakantak 10 ta&#10;Ism Sherali aka xoji&#10;8.000.000 sum berilgan&#10;Perecheslena 7-res&#10;Yuk 25 tonna 115 sum&#10;Yulkira 2.875.000 sum"></textarea>
    <div class="chips"><button class="chip" type="button" id="paste">📋 Nusxadan qo'yish</button><button class="chip" type="button" id="clear">🗑 Tozalash</button></div>
    <div class="found" id="found"></div>
  </section>

  <section class="card hidden" id="c-prices">
    <label class="t" id="l-prices">💵 Narxi (1 kg uchun, so'm)</label>
    <input id="tparty" type="text" class="hidden" autocomplete="off" placeholder="Kimdan keldi (yetkazib beruvchi)">
    <div id="plist" class="found"></div>
    <div class="sum" id="psum"></div>
  </section>

  <section class="card hidden" id="c-day">
    <label class="t" id="l-day">📅 Qaysi kuni ketdi?</label>
    <div class="chips">
      <button class="chip" type="button" id="d-t" aria-pressed="true">Bugun</button>
      <button class="chip" type="button" id="d-y" aria-pressed="false">Kecha</button>
      <button class="chip" type="button" id="d-c" aria-pressed="false">🗓 Kalendar</button>
    </div>
    <input id="dday" type="date" class="hidden">
  </section>

  <section class="card" id="c-product">
    <label class="t" id="l-product">Mahsulot</label>
    <input id="search" type="search" placeholder="Qidirish…" class="hidden" autocomplete="off">
    <div class="chips scroll" id="products"></div>
    <input id="productOther" type="text" placeholder="Nomini yozing" class="hidden" autocomplete="off">
  </section>

  <section class="card" id="c-qty">
    <label class="t" id="l-qty">Miqdor</label>
    <div class="chips" id="mode"><button class="chip" type="button" id="m-kg" aria-pressed="true">kg</button><button class="chip" type="button" id="m-bag" aria-pressed="false">qop</button></div>
    <div class="row"><input id="qty" type="number" inputmode="decimal" min="0" step="any" placeholder="0"><span class="unit" id="unit">qop</span></div>
    <div class="chips" id="quick"></div>
    <div class="calc" id="calc"></div>
  </section>

  <section class="card hidden" id="c-how">
    <label class="t">Qanday keldi?</label>
    <div class="chips"><button class="chip" type="button" id="h-bag" aria-pressed="false">📦 Qopda (ishchilar tushirdi)</button><button class="chip" type="button" id="h-bulk" aria-pressed="false">🚛 Sochma (o'zi to'kildi)</button></div>
  </section>

  <section class="card" id="c-party">
    <label class="t" id="l-party">Kimga</label>
    <input id="party" type="text" list="partyList" autocomplete="off" placeholder="Ism yoki firma">
    <datalist id="partyList"></datalist>
  </section>

  <section class="card" id="c-truck">
    <label class="t">Mashina raqami</label>
    <input id="truck" type="text" list="truckList" autocomplete="off" placeholder="01 A 123 BC" style="text-transform:uppercase">
    <datalist id="truckList"></datalist>
    <div class="chips"><button class="chip" type="button" id="selfPick">Xaridor o'zi olib ketdi</button></div>
  </section>

  <section class="card" id="c-price">
    <label class="t" id="l-price">1 kg narxi (so'm) — ixtiyoriy</label>
    <input id="price" type="text" inputmode="decimal" autocomplete="off" placeholder="Masalan: 15 000 000 — bilmasangiz bo'sh qoldiring">
    <div class="calc" id="total"></div>
  </section>

  <section class="card" id="c-when">
    <label class="t">Qachon bo'ldi?</label>
    <div class="chips">
      <button class="chip" type="button" id="w-now" aria-pressed="true">Hozir</button>
      <button class="chip" type="button" id="w-yest" aria-pressed="false">Kecha</button>
      <button class="chip" type="button" id="w-other" aria-pressed="false">📅 Boshqa kun</button>
    </div>
    <input id="when" type="datetime-local" class="hidden">
  </section>

  <div class="err" id="err"></div>
  <button id="send" type="button">✅ Saqlash</button>
</main>

<script>
(function(){
  // Telegram ichida ochilganmi? (oddiy brauzerda platform = "unknown")
  const W = window.Telegram && window.Telegram.WebApp;
  const tg = W && W.platform && W.platform !== "unknown" ? W : null;
  const demo = !tg && window.parent !== window;
  if (tg) { tg.ready(); tg.expand(); }
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const type = q.get("t") || "ship";
  let data = {};
  try {
    let s = (q.get("d") || "").replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    const bytes = Uint8Array.from(atob(s), c => c.charCodeAt(0));
    data = JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { data = {}; }

  const fmt = n => (Math.round(n * 100) / 100).toLocaleString("ru-RU");
  let shipMode = "form", textApi = null;
  // "15 000", "15.000.000", "1,5 mln", "300 ming" — hammasini tushunadi
  const num = v => {
    let t = String(v || "").toLowerCase().replace(/\s/g, "");
    let mul = 1;
    if (/mln|million/.test(t)) mul = 1e6; else if (/ming|k$/.test(t)) mul = 1e3;
    t = t.replace(/[^0-9.,]/g, "");
    if (!t) return NaN;
    const dots = (t.match(/\./g) || []).length, commas = (t.match(/,/g) || []).length;
    if (dots && commas) { const dec = t.lastIndexOf(".") > t.lastIndexOf(",") ? "." : ","; t = t.split(dec === "." ? "," : ".").join(""); t = t.replace(",", "."); }
    else if (dots + commas > 1) t = t.replace(/[.,]/g, "");
    else if (dots + commas === 1 && /[.,]\d{3}$/.test(t) && mul === 1) t = t.replace(/[.,]/, "");
    else t = t.replace(",", ".");
    const n = parseFloat(t) * mul;
    return n > 0 && isFinite(n) ? n : NaN;
  };
  const isPiece = n => /^(QOP|PAQIR)/i.test((n || "").trim());
  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch(e){ return []; } },
    add(k,v){ if(!v) return; try { const a = store.get(k).filter(x => x !== v); a.unshift(v); localStorage.setItem(k, JSON.stringify(a.slice(0,15))); } catch(e){} }
  };
  const fillList = (id, key) => { const dl = $(id); store.get(key).forEach(v => { const o = document.createElement("option"); o.value = v; dl.appendChild(o); }); };

  const state = { product: null, other: false, place: null, placeOther: false };
  const products = (data.p || []).map(x => ({ name: x[0], unit: x[1], kg: x[2] }));
  const raws = data.r || [];
  const places = data.pl || [];

  // ---------- sarlavha va qaysi maydonlar ko'rinadi ----------
  const show = (id, on) => $(id).classList.toggle("hidden", !on);
  if (type === "ship") {
    $("title").textContent = "🚚 Yuk jo'natildi";
    $("l-product").textContent = "Qaysi mahsulot";
    $("l-party").textContent = "Kimga (xaridor)";
    $("l-price").textContent = "Jami summa (so'm) — ixtiyoriy";
  } else if (type === "prod") {
    $("title").textContent = "🏭 Ishlab chiqarildi";
    $("l-product").textContent = "Qaysi mahsulot";
    ["c-party","c-truck","c-price"].forEach(id => show(id, false));
  } else {
    $("title").textContent = "📦 Xomashyo keldi";
    $("l-product").textContent = "Qaysi xomashyo";
    $("l-party").textContent = "Kimdan (yetkazib beruvchi)";
    $("party").placeholder = "Firma yoki ism";
    ["c-truck"].forEach(id => show(id, false));
    show("search", raws.length > 12);
  }
  fillList("partyList", type === "raw" ? "suppliers" : "customers");
  fillList("truckList", "trucks");

  // ---------- mahsulot tanlash ----------
  const box = $("products");
  function chip(text, onClick, extra) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = text; b.setAttribute("aria-pressed", "false");
    if (extra) b.dataset.v = extra;
    b.addEventListener("click", onClick);
    return b;
  }
  function selectProduct(name, btn) {
    state.product = name; state.other = false;
    box.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === btn)));
    show("productOther", false);
    refresh();
  }
  const names = type === "raw" ? raws : products.map(p => p.name);
  names.forEach(n => { const b = chip(n, () => selectProduct(n, b), n); box.appendChild(b); });
  if (type === "raw") {
    const o = chip("✏️ Boshqa…", () => {
      state.product = null; state.other = true;
      box.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === o)));
      show("productOther", true); $("productOther").focus(); refresh();
    });
    box.appendChild(o);
  }
  $("search").addEventListener("input", e => {
    const s = e.target.value.trim().toLowerCase();
    box.querySelectorAll(".chip").forEach(c => { c.classList.toggle("hidden", !!s && !!c.dataset.v && !c.dataset.v.toLowerCase().includes(s)); });
  });

  // ---------- miqdor ----------
  // kg yoki qop bilan yozish (mahsulot uchun). Odatda kg.
  state.mode = "kg";
  if (type === "raw") show("mode", false);
  function setMode(m) {
    state.mode = m;
    $("m-kg").setAttribute("aria-pressed", String(m === "kg"));
    $("m-bag").setAttribute("aria-pressed", String(m === "bag"));
    $("qty").value = "";
    buildQuick(); refresh(); $("qty").focus();
  }
  $("m-kg").addEventListener("click", () => setMode("kg"));
  $("m-bag").addEventListener("click", () => setMode("bag"));
  function buildQuick() {
    $("quick").innerHTML = "";
    const vals = (type === "raw" || state.mode === "kg") ? [1000, 5000, 10000, 20000]
               : (type === "ship" ? [20, 40, 80, 100] : [40, 100, 200, 400]);
    vals.forEach(v => $("quick").appendChild(chip(String(v), () => { $("qty").value = v; refresh(); })));
  }
  buildQuick();

  $("selfPick").addEventListener("click", () => { $("truck").value = "Xaridor o'zi olib ketdi"; refresh(); });

  // ---------- hisoblash va tekshirish ----------
  function current() {
    const product = state.other ? $("productOther").value.trim() : state.product;
    const qty = num($("qty").value);
    return {
      product, qty,
      party: $("party").value.trim(),
      truck: $("truck").value.trim().toUpperCase(),
      price: num($("price").value)
    };
  }
  function problem(c) {
    if (!c.product) return type === "raw" ? "Xomashyoni tanlang" : "Mahsulotni tanlang";
    if (!(c.qty > 0)) return "Miqdorni yozing";
    if (type === "raw" && c.product && !isPiece(c.product) && !state.how) return "Qopdami yoki sochmami — tanlang";
    if (type !== "prod" && !c.party) return type === "raw" ? "Kimdan kelganini yozing" : "Xaridorni yozing";
    if (type === "ship" && !c.truck) return "Mashina raqamini yozing";
    return null;
  }
  function refresh() {
    if (shipMode === "text") { textApi && textApi.check(); return; }
    const c = current();
    let unit = "kg";
    if (type !== "raw") { const p = products.find(x => x.name === c.product); const bag = p ? p.unit : "qop";
      $("m-bag").textContent = bag;
      unit = state.mode === "kg" ? "kg" : bag;
      const kg = p && c.qty > 0 ? (state.mode === "kg" ? c.qty : c.qty * p.kg) : 0;
      const bags = p ? kg / p.kg : 0;
      $("calc").innerHTML = !kg ? "" : state.mode === "kg"
        ? "= <b>" + fmt(bags) + " " + bag + "</b> (" + p.kg + " kg dan)"
        : "= <b>" + fmt(kg) + " kg</b> (" + p.kg + " kg dan)";
      $("total").innerHTML = kg && c.price > 0 ? "1 " + bag + ": <b>" + fmt(c.price / bags) + "</b> so'm · 1 kg: <b>" + fmt(c.price / kg) + "</b> so'm" : ""; }
    else { unit = isPiece(c.product) ? "dona" : "kg"; $("calc").textContent = "";
      show("c-how", !!c.product && !isPiece(c.product));
      $("l-price").textContent = "1 " + unit + " narxi (so'm) — ixtiyoriy";
      $("total").innerHTML = c.qty > 0 && c.price > 0 ? "Jami: <b>" + fmt(c.qty * c.price) + " so'm</b>" : ""; }
    $("unit").textContent = unit;
    $("l-qty").textContent = "Necha " + unit;
    const p = problem(c);
    if (tg && tg.MainButton) {
      tg.MainButton.setText(p ? p : "✅ Saqlash");
      p ? tg.MainButton.disable() : tg.MainButton.enable();
      tg.MainButton.color = p ? (tg.themeParams.hint_color || "#8a9099") : (tg.themeParams.button_color || "#2f7de1");
      tg.MainButton.show();
    } else {
      $("send").style.display = "block";
      $("send").textContent = p ? p : "✅ Saqlash";
      $("send").disabled = !!p;
    }
  }
  ["qty","party","truck","price","productOther"].forEach(id => $(id).addEventListener("input", refresh));
  ["bag","bulk"].forEach(k => $("h-" + k).addEventListener("click", () => {
    state.how = k;
    ["bag","bulk"].forEach(j => $("h-" + j).setAttribute("aria-pressed", String(j === k)));
    refresh();
  }));

  function submit() {
    if (shipMode === "text") { textApi && textApi.send(); return; }
    const c = current(); const p = problem(c);
    if (p) { $("err").textContent = p; if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error"); return; }
    const out = { t: type, product: c.product };
    const w = whenValue();
    if (w) out.ts = w;
    if (type === "raw") { out.qty = c.qty; out.party = c.party; if (c.price > 0) out.price = c.price; if (state.how === "bulk" && !isPiece(c.product)) out.bulk = true; store.add("suppliers", c.party); }
    else if (state.mode === "kg") { out.kg = c.qty; }
    else { out.count = c.qty; }
    if (type === "ship") { out.party = c.party; out.truck = c.truck; if (c.price > 0) out.sum = c.price; store.add("customers", c.party); store.add("trucks", c.truck); }
    if (tg && tg.sendData) { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); tg.sendData(JSON.stringify(out)); }
    else if (demo) { window.parent.postMessage({ newmiksDemo: out }, "*"); $("err").textContent = ""; }
    else { $("err").textContent = "Bu forma faqat Telegram ichida ishlaydi."; }
  }
  // ---------- qachon bo'ldi ----------
  const pad = n => String(n).padStart(2, "0");
  const local = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  let whenMode = "now";
  function setWhen(m) {
    whenMode = m;
    ["now", "yest", "other"].forEach(k => $("w-" + k).setAttribute("aria-pressed", String(k === m)));
    show("when", m !== "now");
    if (m === "yest") { const d = new Date(); d.setDate(d.getDate() - 1); $("when").value = local(d); }
    if (m === "other" && !$("when").value) $("when").value = local(new Date());
    $("when").max = local(new Date());
  }
  $("w-now").addEventListener("click", () => setWhen("now"));
  $("w-yest").addEventListener("click", () => setWhen("yest"));
  $("w-other").addEventListener("click", () => setWhen("other"));
  function whenValue() { return whenMode === "now" ? null : ($("when").value || null); }

  if (tg && tg.MainButton) tg.MainButton.onClick(submit);
  $("send").addEventListener("click", submit);

  if (!names.length) $("err").textContent = "Ro'yxat kelmadi. Botda /start bosib, tugmani qaytadan bosing.";
  {
    textApi = type === "ship" ? shipText() : rpText();
    const FORM = type === "ship" ? ["c-product","c-qty","c-party","c-truck","c-price","c-when"]
               : type === "raw" ? ["c-product","c-qty","c-party","c-price","c-when"] : ["c-product","c-qty","c-when"];
    const TEXT = ["c-text","c-prices","c-day"];
    function setShipMode(m) {
      shipMode = m;
      $("sm-form").setAttribute("aria-pressed", String(m === "form"));
      $("sm-text").setAttribute("aria-pressed", String(m === "text"));
      FORM.forEach(id => show(id, m === "form"));
      TEXT.forEach(id => show(id, m === "text"));
      if (m === "text") show("c-how", false);
      $("err").textContent = "";
      refresh();
    }
    show("c-mode", true);
    $("sm-form").addEventListener("click", () => setShipMode("form"));
    $("sm-text").addEventListener("click", () => setShipMode("text"));
    setShipMode("form");
  }
  refresh();

  // =================================================================
  //  🚚 YUK JO'NATILDI — matn tashlanadi, narx va kun yoziladi
  // =================================================================
  // =================================================================
  //  📦 XOMASHYO / 🏭 ISHLAB CHIQARISH — matndan, bir nechta mahsulot birdan
  // =================================================================
  function rpText() {
    const raw = type === "raw";
    const items0 = raw ? (data.r || []).map(n => ({ name: n, piece: isPiece(n), kg: 1 }))
                       : (data.p || []).map(x => ({ name: x[0], unit: x[1], kg: x[2], piece: false }));
    $("l-text").textContent = raw ? "📋 Kelgan xomashyo matni" : "📋 Ishlab chiqarilgan mahsulot matni";
    $("otext").placeholder = raw ? "Masalan:\n\nAzim aka sement\nSement 30 tonna sochma\nQum 20 tonna\nQop 5000 dona"
                                 : "Masalan:\n\nPlaster 05 20 tonna\nKliy 510 400 qop\nFinish 5 tonna";
    $("l-prices").textContent = raw ? "💵 Narxi va qanday keldi" : "📦 Topilgan mahsulotlar";
    $("l-day").textContent = raw ? "📅 Qaysi kuni keldi?" : "📅 Qaysi kuni ishlab chiqarildi?";
    show("tparty", raw);
    const norm = x => String(x).toLowerCase().replace(/[ʻ‘’]/g, "'").replace(/[^a-z0-9а-яё]/g, "");
    const GENERIC = ["plaster","kliy","qora","pol","kafel","suvoq","qop"];
    function match(low) {
      const n = norm(low); let best = null, bl = 0;
      items0.forEach(p => {
        const full = norm(p.name); let len = 0;
        if (full && n.includes(full)) len = full.length + 100;
        else {
          p.name.toLowerCase().split(/[\s.]+/).forEach(w => { const nw = norm(w); if (nw.length >= 3 && !GENERIC.includes(nw) && n.includes(nw) && nw.length > len) len = nw.length; });
          if (!len && full === "plaster05" && /(rodman|plaster)[\s.]*0?5(?!\d)/.test(low)) len = 50;
        }
        if (len > bl) { bl = len; best = p; }
      });
      return best;
    }
    function parse(text) {
      const r = { items: [], party: null };
      text.split(/\r?\n/).forEach(rawLine => {
        const line = rawLine.trim(); if (!line) return;
        const low = line.toLowerCase();
        const p = match(low);
        if (p) {
          let rest = low; p.name.toLowerCase().split(/\s+/).forEach(w => { if (w.length > 1) rest = rest.split(w).join(" "); });
          rest = rest.replace(/(rodman|plaster|kafel)[\s.]*(0?5|mp\s*77)?(?!\d)/g, " ");
          const qm = rest.match(/(\d+(?:[.,]\d+)?)\s*(tonna|tonn|tn|t|kg|kilo|qop|meshok|ta|dona|sht|paqir|vedro)(?![a-z])/);
          let n = null, unit = null;
          if (qm) { n = parseFloat(qm[1].replace(",", ".")); unit = qm[2]; }
          else { const nm = rest.match(/\d+(?:[.,]\d+)?/); if (nm) { n = parseFloat(nm[0].replace(",", ".")); unit = "?"; } }
          if (n > 0) {
            let q;
            if (p.piece) q = n;                                     // dona
            else if (unit === "ta" || unit === "qop" || unit === "meshok" || unit === "paqir" || unit === "vedro" || unit === "dona" || unit === "sht") q = raw ? n * 50 : n * p.kg;
            else if (unit[0] === "t") q = n * 1000; else if (unit[0] === "k") q = n;
            else q = n <= 100 ? n * 1000 : n;
            r.items.push({ p, q, bulk: /sochma|sochiq|sementovoz|nasip/.test(low) ? true : null, note: raw && !p.piece && /qop|meshok/.test(unit || "") ? "qop 50 kg deb olindi" : "" });
            return;
          }
        }
        if (!r.party && !/^\d/.test(line)) r.party = line;
      });
      return r;
    }
    const tons = kg => kg >= 1000 ? fmt(kg / 1000) + " t" : fmt(kg) + " kg";
    const esc = x => String(x).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const savedP = {}, savedH = {};
    let cur = { items: [] }, partyTouched = false;
    $("tparty").addEventListener("input", () => { partyTouched = true; check(); });
    function render() {
      cur = parse($("otext").value);
      if (raw && !partyTouched) $("tparty").value = cur.party || "";
      $("found").innerHTML = "";
      const box = $("plist"); box.innerHTML = "";
      if (!cur.items.length) box.innerHTML = "<span class=k>Matnni tashlang — " + (raw ? "xomashyolar" : "mahsulotlar") + " shu yerda chiqadi.</span>";
      cur.items.forEach(it => {
        const d = document.createElement("div"); d.className = "pr";
        const qtxt = it.p.piece ? fmt(it.q) + " dona" : tons(it.q) + (raw ? "" : " (" + fmt(Math.round(it.q / it.p.kg)) + " " + esc(it.p.unit) + ")");
        d.innerHTML = "<div class=n>" + (raw ? "📦 " : "🏭 ") + esc(it.p.name) + " — " + qtxt + "</div>" + (it.note ? "<div class=s>" + it.note + "</div>" : "");
        if (raw) {
          const inp = document.createElement("input"); inp.type = "text"; inp.inputMode = "decimal";
          inp.placeholder = "1 " + (it.p.piece ? "dona" : "kg") + " narxi — ixtiyoriy";
          inp.value = savedP[it.p.name] || "";
          const sm = document.createElement("div"); sm.className = "s";
          const upd = () => { savedP[it.p.name] = inp.value; const v = num(inp.value); it.price = v > 0 ? v : null;
            sm.textContent = it.price ? "= " + fmt(it.price * it.q) + " so'm" : ""; total(); };
          inp.addEventListener("input", upd);
          d.appendChild(inp); d.appendChild(sm);
          if (!it.p.piece) {
            if (savedH[it.p.name] !== undefined) it.bulk = savedH[it.p.name];
            const ch = document.createElement("div"); ch.className = "chips";
            const mk = (txt, val) => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = txt;
              b.setAttribute("aria-pressed", String(it.bulk === val));
              b.addEventListener("click", () => { it.bulk = val; savedH[it.p.name] = val; ch.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b))); check(); });
              return b; };
            ch.appendChild(mk("📦 Qopda", false)); ch.appendChild(mk("🚛 Sochma", true));
            d.appendChild(ch);
          }
          upd();
        }
        box.appendChild(d);
      });
      total(); check();
    }
    function total() {
      if (!raw) { const kg = cur.items.reduce((a, it) => a + it.q, 0); $("psum").innerHTML = kg ? "⚖️ Jami: <b>" + tons(kg) + "</b>" : ""; return; }
      let s = 0; cur.items.forEach(it => { if (it.price) s += it.price * it.q; });
      $("psum").innerHTML = s ? "💰 Jami: <b>" + fmt(s) + " so'm</b>" : "";
    }
    const pad = n => String(n).padStart(2, "0");
    const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    let day = "t";
    function setDay(k) { day = k; ["t","y","c"].forEach(j => $("d-" + j).setAttribute("aria-pressed", String(j === k)));
      $("dday").classList.toggle("hidden", k !== "c"); $("dday").max = ymd(new Date());
      if (k === "c") { if (!$("dday").value) $("dday").value = ymd(new Date()); try { $("dday").showPicker(); } catch (e) {} } check(); }
    ["t","y","c"].forEach(k => $("d-" + k).addEventListener("click", () => setDay(k)));
    $("dday").addEventListener("change", check);
    function tsValue() {
      const now = new Date(), hm = "T" + pad(now.getHours()) + ":" + pad(now.getMinutes());
      if (day === "t") return null;
      if (day === "y") { const d = new Date(); d.setDate(d.getDate() - 1); return ymd(d) + hm; }
      const v = $("dday").value; return v && v !== ymd(now) ? v + hm : null;
    }
    function problem() {
      if (!$("otext").value.trim()) return "Matnni tashlang";
      if (!cur.items.length) return raw ? "Matnda xomashyo topilmadi" : "Matnda mahsulot topilmadi";
      if (raw && !$("tparty").value.trim()) return "Kimdan kelganini yozing";
      if (raw && cur.items.some(it => !it.p.piece && it.bulk == null)) return "Qopdami yoki sochmami — tanlang";
      if (day === "c" && !$("dday").value) return "Kunni tanlang";
      return null;
    }
    function check() {
      if (shipMode !== "text") return;
      const p = problem();
      if (tg && tg.MainButton) {
        tg.MainButton.setText(p ? p : "✅ Saqlash");
        p ? tg.MainButton.disable() : tg.MainButton.enable();
        tg.MainButton.color = p ? (tg.themeParams.hint_color || "#8a9099") : (tg.themeParams.button_color || "#2f7de1");
        tg.MainButton.show();
      } else { $("send").style.display = "block"; $("send").textContent = p ? p : "✅ Saqlash"; $("send").disabled = !!p; }
    }
    function send() {
      const p = problem(); if (p) { $("err").textContent = p; return; }
      const out = { t: type };
      if (raw) {
        out.party = $("tparty").value.trim().slice(0, 60); store.add("suppliers", out.party);
        out.multi = cur.items.map(it => { const o = { product: it.p.name, qty: Math.round(it.q * 1000) / 1000 }; if (it.price) o.price = it.price; if (it.bulk) o.bulk = true; return o; });
      } else out.multi = cur.items.map(it => ({ product: it.p.name, kg: Math.round(it.q * 1000) / 1000 }));
      const w = tsValue(); if (w) out.ts = w;
      if (tg && tg.sendData) { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); tg.sendData(JSON.stringify(out)); }
      else if (demo) window.parent.postMessage({ newmiksDemo: out }, "*");
      else $("err").textContent = "Bu forma faqat Telegram ichida ishlaydi.";
    }
    let tmr; $("otext").addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(render, 250); });
    $("paste").addEventListener("click", async () => { try { $("otext").value = await navigator.clipboard.readText(); render(); } catch (e) { $("otext").focus(); $("err").textContent = "Matn maydonini bosib turing va «Вставить» ni tanlang."; } });
    $("clear").addEventListener("click", () => { $("otext").value = ""; render(); $("otext").focus(); });
    render();
    return { send, check };
  }

  function shipText() {
    const products = (data.p || []).map(x => ({ name: x[0], unit: x[1], kg: x[2] }));
    const num2 = v => {
      let t = String(v || "").toLowerCase().replace(/\s/g, ""); let mul = 1;
      if (/mln|million/.test(t)) mul = 1e6; else if (/ming/.test(t)) mul = 1e3;
      t = t.replace(/[^0-9.,]/g, ""); if (!t) return NaN;
      const dots = (t.match(/\./g) || []).length, commas = (t.match(/,/g) || []).length;
      if (dots + commas > 1) t = t.replace(/[.,](?=\d{3}(\D|$))/g, "").replace(",", ".");
      else if (dots + commas === 1 && /[.,]\d{3}$/.test(t) && mul === 1) t = t.replace(/[.,]/, "");
      else t = t.replace(",", ".");
      const n = parseFloat(t) * mul; return n > 0 && isFinite(n) ? n : NaN;
    };
    const norm = x => x.toLowerCase().replace(/[ʻ‘’]/g, "'").replace(/[^a-z0-9а-яё]/g, "");
    const GENERIC = ["plaster","kliy","qora","pol","kafel","suvoq"];
    function match(low) {
      const n = norm(low); let best = null, bl = 0;
      products.forEach(p => {
        const full = norm(p.name); let len = 0;
        if (n.includes(full)) len = full.length + 100;
        else {
          p.name.toLowerCase().split(/\s+/).forEach(w => { const nw = norm(w); if (nw.length >= 3 && !GENERIC.includes(nw) && n.includes(nw) && nw.length > len) len = nw.length; });
          if (!len && full === "plaster05" && /(rodman|plaster)[\s.]*0?5(?!\d)/.test(low)) len = 50;
        }
        if (len > bl) { bl = len; best = p; }
      });
      return best;
    }
    function parse(text) {
      const r = { items: [], party: null, truck: null, phone: null };
      text.split(/\r?\n/).forEach(raw => {
        const line = raw.trim(); if (!line) return;
        const low = line.toLowerCase();
        if (/^(tel|\+998|тел)/.test(low)) { if (!r.phone) r.phone = line.replace(/^(tel[a-z.:]*|тел[а-я.:]*)/i, "").trim(); return; }
        if (/^yuk|kira|dostavka|dastavka|berilgan|berildi|avans|oldindan|perech|perich|naqd|nalich|^ism|haydovchi/.test(low)) return;
        const tm = line.match(/(?:^|\D)(\d{2})[\s.\-]*([A-Za-z])?[\s.\-]*(\d{3})[\s.\-]*([A-Za-z]{2,3})(?![A-Za-z])/);
        const p = match(low);
        if (!p && tm && !/sum|som|so'm|ming|mln/i.test(tm[4])) { if (!r.truck) r.truck = (tm[1] + (tm[2] || "") + tm[3] + tm[4]).toUpperCase(); return; }
        if (p) {
          let rest = low; p.name.toLowerCase().split(/\s+/).forEach(w => { rest = rest.split(w).join(" "); });
          rest = rest.replace(/(rodman|plaster|kafel)[\s.]*(0?5|mp\s*77)?(?!\d)/g, " ");
          const qm = rest.match(/(\d+(?:[.,]\d+)?)\s*(tonna|tonn|tn|t|kg|kilo|qop|meshok|ta|dona|sht|paqir|vedro)(?![a-z])/);
          let n = null, unit = null;
          if (qm) { n = parseFloat(qm[1].replace(",", ".")); unit = qm[2]; }
          else { const nm = rest.match(/\d+(?:[.,]\d+)?/); if (nm) { n = parseFloat(nm[0].replace(",", ".")); unit = "?"; } }
          if (n > 0) {
            let kg;
            if (unit === "ta") kg = n * p.kg; else if (unit[0] === "t") kg = n * 1000; else if (unit[0] === "k") kg = n;
            else if (unit === "?") kg = n <= 100 ? n * 1000 : n * p.kg; else kg = n * p.kg;
            r.items.push({ p, kg }); return;
          }
        }
        if (!r.party) r.party = line;
      });
      return r;
    }
    const tons = kg => kg >= 1000 ? fmt(kg / 1000) + " t" : fmt(kg) + " kg";
    const saved = {};          // yozilgan narxlar saqlanib qoladi (matn o'zgarsa ham)
    let cur = { items: [] };
    function render() {
      cur = parse($("otext").value);
      const f = [];
      if (cur.party) f.push("<span class=k>👤 Kimga:</span> " + esc(cur.party));
      if (cur.truck) f.push("<span class=k>🚛 Mashina:</span> " + esc(cur.truck));
      if (cur.phone) f.push("<span class=k>📞 Tel:</span> " + esc(cur.phone));
      $("found").innerHTML = f.map(x => "<div>" + x + "</div>").join("");
      const box = $("plist"); box.innerHTML = "";
      if (!cur.items.length) box.innerHTML = "<span class=k>Matnni tashlang — mahsulotlar shu yerda chiqadi.</span>";
      cur.items.forEach((it, i) => {
        const d = document.createElement("div"); d.className = "pr";
        d.innerHTML = "<div class=n>📦 " + esc(it.p.name) + " — " + tons(it.kg) + " (" + fmt(Math.round(it.kg / it.p.kg)) + " " + esc(it.p.unit) + ")</div>";
        const inp = document.createElement("input"); inp.type = "text"; inp.inputMode = "decimal"; inp.placeholder = "1 kg narxi, masalan: 1 440";
        inp.value = saved[it.p.name] || ""; const sm = document.createElement("div"); sm.className = "s";
        const upd = () => { saved[it.p.name] = inp.value; const v = num2(inp.value);
          const perKg = v > 100000 ? v / it.kg : v;     // katta son — jami summa
          it.price = perKg > 0 ? perKg : null;
          sm.textContent = it.price ? (v > 100000 ? "Jami summa deb olindi → 1 kg = " + fmt(perKg) : "= " + fmt(perKg * it.kg) + " so'm") : "";
          total(); check(); };
        inp.addEventListener("input", upd);
        d.appendChild(inp); d.appendChild(sm); box.appendChild(d); upd();
      });
      total(); check();
    }
    function total() {
      let s = 0, all = cur.items.length > 0;
      cur.items.forEach(it => { if (it.price) s += it.price * it.kg; else all = false; });
      $("psum").innerHTML = s ? "💰 Jami: <b>" + fmt(s) + " so'm</b>" + (all ? "" : " (narx yozilganlari)") : "";
    }
    const esc = x => String(x).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    // kun
    const pad = n => String(n).padStart(2, "0");
    const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    let day = "t";
    function setDay(k) { day = k; ["t","y","c"].forEach(j => $("d-" + j).setAttribute("aria-pressed", String(j === k)));
      $("dday").classList.toggle("hidden", k !== "c"); $("dday").max = ymd(new Date());
      if (k === "c") { if (!$("dday").value) $("dday").value = ymd(new Date()); try { $("dday").showPicker(); } catch (e) {} } check(); }
    ["t","y","c"].forEach(k => $("d-" + k).addEventListener("click", () => setDay(k)));
    $("dday").addEventListener("change", check);
    function tsValue() {
      const now = new Date(), hm = "T" + pad(now.getHours()) + ":" + pad(now.getMinutes());
      if (day === "t") return null;
      if (day === "y") { const d = new Date(); d.setDate(d.getDate() - 1); return ymd(d) + hm; }
      const v = $("dday").value; return v && v !== ymd(now) ? v + hm : null;
    }
    function problem() {
      if (!$("otext").value.trim()) return "Buyurtma matnini tashlang";
      if (!cur.items.length) return "Matnda mahsulot topilmadi";
      if (day === "c" && !$("dday").value) return "Kunni tanlang";
      return null;
    }
    function check() {
      if (shipMode !== "text") return;
      const p = problem();
      if (tg && tg.MainButton) {
        tg.MainButton.setText(p ? p : "➡️ Botga yuborish");
        p ? tg.MainButton.disable() : tg.MainButton.enable();
        tg.MainButton.color = p ? (tg.themeParams.hint_color || "#8a9099") : (tg.themeParams.button_color || "#2f7de1");
        tg.MainButton.show();
      } else { $("send").style.display = "block"; $("send").textContent = p ? p : "➡️ Botga yuborish"; $("send").disabled = !!p; }
    }
    function send() {
      const p = problem(); if (p) { $("err").textContent = p; return; }
      const out = { t: "ship", text: $("otext").value.trim().slice(0, 3000), prices: cur.items.filter(it => it.price).map(it => [it.p.name, Math.round(it.price * 100) / 100]) };
      const w = tsValue(); if (w) out.ts = w;
      if (tg && tg.sendData) { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); tg.sendData(JSON.stringify(out)); }
      else if (demo) window.parent.postMessage({ newmiksDemo: out }, "*");
      else $("err").textContent = "Bu forma faqat Telegram ichida ishlaydi.";
    }
    let tmr; $("otext").addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(render, 250); });
    $("paste").addEventListener("click", async () => { try { $("otext").value = await navigator.clipboard.readText(); render(); } catch (e) { $("otext").focus(); $("err").textContent = "Matn maydonini bosib turing va «Вставить» ni tanlang."; } });
    $("clear").addEventListener("click", () => { $("otext").value = ""; render(); $("otext").focus(); });
    render();
    return { send, check };
  }
})();
